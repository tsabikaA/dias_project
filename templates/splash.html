<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>ZEUS WORLD AIRLINES - Splash</title>
        <style>
            body {
                margin: 0; 
                padding: 0; 
                width: 100%; 
                height: 100%;
                font-family:'Times New Roman', Times, serif;
                background-color: #06142e; 
                overflow: hidden; 
            }
            #intro-screen {
                position: fixed; 
                top: 0; 
                left: 0;
                width: 100%;
                height: 100vh;
                background-color: #06142e;
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 9999;
                overflow: hidden;
                transition: opacity 0.8s ease-out;
             }
            #intro-content {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                opacity: 0;
                animation: zeusZoom 3.5s ease-in-out 1.2s forwards;
            }
            #intro-logo {
                color: #ffffff;
                font-weight: 900;
                letter-spacing: 1.5vw;
                font-size: 35vw;
                line-height: 0.95;
                margin-left: 1.5vw;    
            }
            #intro-slogan {
                color: #d4af37;
                font-weight: 700;
                font-size: 3.3vw;
                letter-spacing: 0.45vw;
                margin-top: 2vw;
                margin-left: 0.45vw;
                text-transform: uppercase;
                text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
            }
            @keyframes zeusZoom {
                0% {
                    opacity: 0;
                    transform: scale(0.15);
                }
                20% {
                    opacity: 1;
                }
                85% {
                    opacity: 1;
                    transform: scale(1);
                }
                100% {
                    opacity: 0;
                    transform: scale(1.15);
                }
            }
            </style>
            </head>
            <body>
                <div id="intro-screen">
                    <div id="intro-content">
                        <div id="intro-logo">ZEUS</div>
                        <div id="intro-slogan">FROM THE HEART OF THE ANCIENT HELLAS</div>
                    </div>
                    
                </div>

                <script>
                    window.addEventListener("load", function() {
                        setTimeout( function() {
                            const content = document.getElementById("intro-content");
                            content.style.transition = "opacity 0.8s ease-out";
                            content.style.opacity = "0";

                            setTimeout( function() {
                                window.location.href = "/main";
                            }, 800);
                        }, 4400);
                    });
                            
                        
                        
                    
                
                
                    
                    
        </script>
    </body>
</html>
