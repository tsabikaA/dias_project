<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DIAS AIRLINES - BOOK A FLIGHT</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                font-family: "Times New Roman", Tahoma, Geneva, Verdana;
                background-color: #0f2537;
                color: white;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh
            }
            .booking-container {
                background-color: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(10px);
                padding: 40px;
                border-radius: 10px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                width: 400px;
                text-align: center;
            }
            h2 {
                margin-bottom: 30px;
                letter-spacing: 2px;
            }
            .form-group {
                margin-bottom: 20px;
                text-align: left;
            }
            label {
                display: block;
                margin-bottom: 8px;
                font-size: 14px;
            }
            input[type="text"], input[type="date"] {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                background-color: rgba(255, 255, 255, 0.9);
                color: #333;
                box-sizing: border-box;
            }
            button {
                width: 100%;
                padding: 12px;
                background-color: #1a3a5c;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 16px;
                font-weight: bold;
                letter-spacing: 1px;
                transition: background 0.3s;
            }
            button:hover {
                background-color: #244d7a;
            }
            .back-link {
                display: inline-block;
                margin-top: 20px;
                color: #ccc;
                text-decoration: none;
                font-size: 14px;
            }
            .back-link:hover {
                color: white;
            }
        </style>

     </head>
     <body>
        <div class="booking-container">
            <h2>BOOKING FLIGHT</h2>
            <form action="/search" method="POST">
                <div class="form-group">
                    <label>Departure Airport or City:</label>
                    <input type="text" name="from" placeholder="Enter departure city" required>
                </div>
                <div class="form-group">
                    <label>Arrival Airport or City:</label>
                    <input type="text" name="to" placeholder="Enter destination city" required>
                </div>
                <div class="form-group">
                    <label for="date">Departure Date:</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <button type="submit">SEARCH FLIGHTS</button>
                </form>
                <div>
                    <a href="{{ url_for('home')}}" class="back-link">&larr; Back to Home</a>
                </div>
                </div>
                </body>
                </html>
