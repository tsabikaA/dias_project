<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ORGANIZATION CHART</title>
        <style>
            :root {
                --main-red: #d32f2f;
                --main-blue: #0d47a1;
                --sub-grey: #616161;
                --bg-color: #f5f5f5;
            }
            body {
                font-family: 'Times New Roman', Times, serif;
                background-color: var(--bg-color);
                padding: 20px;
                margin: 0;
            }
            h2 { text-align: center; margin-top: 10px; }
            .back-link {
                display: inline-block;
                margin-bottom: 20px;
                color: var(--main-blue);
                text-decoration: none;
                font-weight: bold;
                font-size: 0.9rem;
            }
            .back-link:hover { text-decoration: underline; }
            .org-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            .row { display: flex; justify-content: center; width: 100%; }
            .box {
                padding: 12px 15px;
                border-radius: 4px;
                color: white;
                font-weight: bold;
                font-size: 0.8rem;
                text-align: center;
                min-width: 160px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.15);
                cursor: pointer;
            }
            .board { background-color: var( --main-red); }
            .executive { background-color: var( --main-blue); }
            .vp-header { background-color: var( --main-red); }
            .sub-box {
                background-color: var( --sub-grey);
                font-weight: normal;
                font-size: 0.75rem;
                margin-top: 8px;
                cursor: default;
            }
            .grid-container {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                gap: 12px;
                width: 100%;
            }
            .column { display: flex; flex-direction: column; align-items: center; }
            .modal {
                display: none;
                position: fixed;
                top: 0; left: 0; width: 100%; height: 100%;
                background-color: rgba(0,0,0,0.6);
                z-index: 1000;
                justify-content: center;
                align-items: center;
            }
            .modal-content {
                background-color: white;
                padding: 25px;
                border-radius: 8px;
                width: 85%;
                max-width: 450px;
                position: relative;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            }
            .close-btn {
                position: absolute;
                top: 10px; right: 15px; 
                font-size: 1.6rem;
                cursor: pointer;
                color: #aaa;
            }
            .close-btn:hover { color: black; }
            .modal h3 { color: var(--main-red); margin-top: 0; }
        </style>
    </head>
    <body></body>
</html>
